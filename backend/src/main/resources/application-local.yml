spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/emras_monolith
    username: emras_user
    password: emras_pass
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EmrasHikariLocal

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:postgresql://localhost:5434/emras_monolith
    user: emras_user
    password: emras_pass

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  jwt:
    secret: local-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  cookie:
    secure: false
  ai:
    api-key: ${ANTHROPIC_API_KEY:your-api-key-here}

logging:
  level:
    root: INFO
    com.emras: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false