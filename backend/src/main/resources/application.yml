spring:
  application:
    name: emras-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ── Disable Flyway auto-configuration (we wire it manually in FlywayConfig.java)
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  # ── JPA ────────────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Mail ───────────────────────────────────────────────────────────────
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true
  info:
    env:
      enabled: true

# ── App info shown at /actuator/info ──────────────────────────────────────
info:
  app:
    name: Emras Backend
    version: 0.0.1
    description: Emras Clothing Store API

# ── SpringDoc / Swagger ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

# ── App custom properties ─────────────────────────────────────────────────
app:
  jwt:
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  ai:
    model: claude-sonnet-4-6
    max-tokens: 1024