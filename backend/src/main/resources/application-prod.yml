spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EmrasHikariProd

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  ai:
    api-key: ${ANTHROPIC_API_KEY}

# ── Actuator: only /health public in prod ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health

# ── Swagger disabled in prod ──────────────────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.emras: INFO
  pattern:
    # JSON structured logs for log aggregation (Loki / CloudWatch)
    console: "{\"time\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}\",\"level\":\"%level\",\"traceId\":\"%X{traceId}\",\"userId\":\"%X{userId}\",\"logger\":\"%logger{36}\",\"message\":\"%msg\"}%n"
