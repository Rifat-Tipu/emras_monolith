spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emras_db_dev}
    username: ${DB_USERNAME:emras_user}
    password: ${DB_PASSWORD:emras_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EmrasHikariDev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
  ai:
    api-key: ${ANTHROPIC_API_KEY}

logging:
  level:
    root: INFO
    com.emras: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n"
